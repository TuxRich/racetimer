; racetimer gate controller on a Teensy 4.1 with Ethernet. GPL-3.0-or-later.
;
; The gate logic is gate/'s, compiled as it is (src/shared_*.c, with
; compat/ standing in for the few ESP-IDF calls it makes); this project adds
; the Teensy's serial ports, Ethernet and settings. The web page is
; gate/web/index.html, embedded by embed_page.py.

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy@6.0.0
framework = arduino
board = teensy41
lib_deps = ssilverman/QNEthernet@0.37.0
; lwIP's queued TCP segments are one pool for every connection, 16 by
; default: room for a few pages open at once, each with some unacknowledged.
build_flags = -DMEMP_NUM_TCP_SEG=64
; Our sources only: compat/'s ESP-IDF names must not reach the libraries.
build_src_flags =
    -Wall
    -Icompat
    -I../gate/src
    -I../third_party/widscan58/firmware/src/proto
    -I../third_party/widscan58/firmware/src/scan
extra_scripts = pre:embed_page.py

[env:native]
; Host unit tests for the target-independent parts (frame parser, WebSocket).
platform = native
build_flags = -std=gnu11 -I../gate/src -I../third_party/widscan58/firmware/src/proto
test_build_src = no
